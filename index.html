<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイク動作確認</title>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #f5f6f8; color: #1f2430;
           font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.2rem; margin: 4px 0 12px; }
    .card { background: #fff; border: 1px solid #e3e6ec; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 1rem; margin: 0 0 8px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 10px 0 4px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem;
                      border: 1px solid #e3e6ec; border-radius: 8px; }
    button { padding: 12px 16px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px;
             background: #3a5bb5; color: #fff; cursor: pointer; margin: 6px 6px 0 0; }
    button.sub { background: #fff; color: #3a5bb5; border: 1px solid #3a5bb5; }
    button:disabled { opacity: 0.5; }
    .mic { width: 100%; padding: 18px; font-size: 1.1rem; }
    .mic.listening { background: #e0554f; }
    .status { font-size: 0.9rem; color: #6b7280; margin-top: 8px; white-space: pre-wrap; }
    .result { font-size: 1.1rem; font-weight: 700; margin-top: 8px; min-height: 1.4em; }
    .ok { color: #1e7a34; } .ng { color: #e0554f; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>マイク動作確認（Phase 0b・GitHub Pages版）</h1>
  <p class="status">LINEなどのアプリ内ブラウザではなく、Safari（iPhone）またはChrome（Android）で開いてください。</p>

  <div class="card">
    <h2>1. あなたについて</h2>
    <label for="name">名前</label>
    <input id="name" placeholder="例：山田">
    <label for="device">端末（わかる範囲で）</label>
    <input id="device" placeholder="例：iPhone 13 / Pixel 7">
  </div>

  <div class="card">
    <h2>2. 音声認識のテスト</h2>
    <div id="recSupport" class="status"></div>
    <button id="micBtn" class="mic">🎤 押して話す</button>
    <p class="status">押したら「スクワット60キロ8回」と話してください。</p>
    <div id="recText" class="result"></div>
    <div id="recStatus" class="status"></div>
  </div>

  <div class="card">
    <h2>3. 読み上げのテスト</h2>
    <div id="synSupport" class="status"></div>
    <button id="speakBtn">🔊 読み上げる</button>
    <p class="status">音が出たかどうかを選んでください（マナーモードは解除してください）。</p>
    <button class="sub" data-heard="聞こえた">聞こえた</button>
    <button class="sub" data-heard="聞こえない">聞こえない</button>
    <div id="heardStatus" class="status"></div>
  </div>

  <div class="card">
    <h2>4. 結果を送る</h2>
    <label for="comment">気づいたこと（任意）</label>
    <textarea id="comment" rows="2" placeholder="例：2回目からは許可を聞かれなかった"></textarea>
    <button id="sendBtn">結果を送る</button>
    <div id="sendStatus" class="status"></div>
  </div>
</div>

<script>
  // ▼ Apps ScriptのウェブアプリのURL（…/exec で終わるもの）に書き換える
  var API_URL = 'https://script.google.com/macros/s/AKfycbwrzzhQUdEe8OCHN61397khwvlNxB9l8fFTyV-fbFGV6S2JWdX-koAhw9agwYUNjBO3DQ/exec';

  // 確認結果をここに集めて、最後にまとめてサーバーへ送る
  var result = {
    host: 'GitHub Pages',
    userAgent: navigator.userAgent,
    recognitionSupported: '',
    micPermission: '未確認',
    recognizedText: '',
    recognitionError: '',
    synthesisSupported: '',
    synthesisHeard: '未回答'
  };

  // ---------- 音声認識 ----------
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recSupport = document.getElementById('recSupport');
  var micBtn = document.getElementById('micBtn');
  var recText = document.getElementById('recText');
  var recStatus = document.getElementById('recStatus');
  var listening = false;
  var lastTranscript = '';   // 途中経過も含めた、最後に聞き取れた文
  var recognizer = null;

  if (Recognition) {
    result.recognitionSupported = 'あり';
    recSupport.innerHTML = '<span class="ok">このブラウザは音声認識に対応しています。</span>';
  } else {
    result.recognitionSupported = 'なし';
    recSupport.innerHTML = '<span class="ng">このブラウザは音声認識に対応していません。</span>';
    micBtn.disabled = true;
  }

  micBtn.addEventListener('click', function () {
    if (!Recognition) return;
    if (listening && recognizer) { recognizer.stop(); return; }

    recognizer = new Recognition();
    recognizer.lang = 'ja-JP';
    recognizer.interimResults = true;   // 話している途中の文字も表示する
    recognizer.maxAlternatives = 1;

    recognizer.onstart = function () {
      listening = true;
      result.micPermission = '許可された';
      micBtn.classList.add('listening');
      micBtn.textContent = '● 聞き取り中（押すと止まる）';
      recStatus.textContent = '';
      lastTranscript = '';
      result.recognizedText = '';
    };
    recognizer.onresult = function (e) {
      var text = '';
      for (var i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      recText.textContent = text;
      lastTranscript = text;
      if (e.results[e.results.length - 1].isFinal) {
        result.recognizedText = text;
        result.recognitionError = '';
      }
    };
    recognizer.onerror = function (e) {
      result.recognitionError = e.error;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        result.micPermission = 'ブロックされた';
      }
      recStatus.innerHTML = '<span class="ng">エラー: ' + e.error + '</span>\n' + explainError(e.error);
    };
    recognizer.onend = function () {
      listening = false;
      micBtn.classList.remove('listening');
      micBtn.textContent = '🎤 押して話す';
      // iPhoneのSafariでは「確定」の合図が来ないまま終わることがあるため、途中経過の文を結果として使う
      if (!result.recognizedText && lastTranscript) {
        result.recognizedText = lastTranscript + '（途中経過）';
      }
      if (result.recognizedText) {
        recStatus.innerHTML = '<span class="ok">認識できました。</span>';
      } else if (!result.recognitionError) {
        result.recognitionError = '文字にならずに終了';
        recStatus.innerHTML = '<span class="ng">文字になりませんでした。もう一度、ボタンを押してすぐに話してください。</span>';
      }
    };

    try {
      recognizer.start();
    } catch (err) {
      result.recognitionError = String(err);
      recStatus.innerHTML = '<span class="ng">開始できませんでした: ' + err + '</span>';
    }
  });

  // よくあるエラーの意味（画面に表示する）
  function explainError(code) {
    var map = {
      'not-allowed': 'マイクの使用がブロックされました。画面の枠（iframe）の制限か、ブラウザの設定が原因の可能性があります。',
      'service-not-allowed': '音声認識サービスが使えない状態です。',
      'no-speech': '声が聞き取れませんでした。もう一度試してください。',
      'audio-capture': 'マイクが見つかりませんでした。',
      'network': 'ネットワークの問題で認識できませんでした。'
    };
    return map[code] || '';
  }

  // ---------- 読み上げ ----------
  var synSupport = document.getElementById('synSupport');
  if ('speechSynthesis' in window) {
    result.synthesisSupported = 'あり';
    synSupport.innerHTML = '<span class="ok">このブラウザは読み上げに対応しています。</span>';
  } else {
    result.synthesisSupported = 'なし';
    synSupport.innerHTML = '<span class="ng">このブラウザは読み上げに対応していません。</span>';
    document.getElementById('speakBtn').disabled = true;
  }

  document.getElementById('speakBtn').addEventListener('click', function () {
    var u = new SpeechSynthesisUtterance('今日はデイ2、上半身です。最初はベンチプレス、8回を4セットです。');
    u.lang = 'ja-JP';
    u.rate = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  });

  var heardBtns = document.querySelectorAll('[data-heard]');
  for (var i = 0; i < heardBtns.length; i++) {
    heardBtns[i].addEventListener('click', function () {
      result.synthesisHeard = this.getAttribute('data-heard');
      document.getElementById('heardStatus').textContent = '回答: ' + result.synthesisHeard;
    });
  }

  // ---------- 送信 ----------
  document.getElementById('sendBtn').addEventListener('click', function () {
    var btn = this;
    var status = document.getElementById('sendStatus');
    result.name = document.getElementById('name').value.trim();
    result.device = document.getElementById('device').value.trim();
    result.comment = document.getElementById('comment').value.trim();
    if (!result.name) { status.innerHTML = '<span class="ng">名前を入力してください。</span>'; return; }

    // URLの書き換え忘れ・貼り間違いを先にチェックする
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\s\/]+\/exec$/.test(API_URL)) {
      status.innerHTML = '<span class="ng">API_URLが正しくありません。…/exec で終わるウェブアプリのURLに書き換えてください（現在: ' + API_URL + '）</span>';
      return;
    }

    btn.disabled = true;
    status.textContent = '送信中…';
    fetch(API_URL, {
      method: 'POST',
      // text/plain にすると、Apps Script側で扱えない事前確認（CORSのプリフライト）が起きない
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveResult', data: result })
    })
      .then(function (res) {
        // 返ってきた中身を文字として読み、JSONでなければ原因がわかるように先頭を表示する
        return res.text().then(function (text) {
          try { return JSON.parse(text); }
          catch (e) {
            var head = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
            throw new Error('サーバーの返事がJSONではありません（状態 ' + res.status + '）: ' + head);
          }
        });
      })
      .then(function (json) {
        if (!json.ok) throw new Error(json.error || '不明なエラー');
        status.innerHTML = '<span class="ok">' + json.message + '</span>';
      })
      .catch(function (err) {
        btn.disabled = false;
        status.innerHTML = '<span class="ng">送信できませんでした: ' + err.message + '</span>';
      });
  });
</script>
</body>
</html>
